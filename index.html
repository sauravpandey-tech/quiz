<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">
        <p class="eyebrow">10 questions · instant feedback</p>
        <h1>Code With AI Quiz</h1>

        <div id="quiz">
            <div class="meta">
                <span id="progress">Question 1 of 10</span>
                <span id="score-live">Score: 0</span>
            </div>
            <div class="progress-bar" aria-hidden="true">
                <div id="progress-fill"></div>
            </div>

            <h2 id="question"></h2>
            <div id="options"></div>
        </div>

        <p id="result"></p>
        <button id="restart" type="button" hidden>Play again</button>
    </main>

    <script src="script.js"></script>

</body>
</html>
